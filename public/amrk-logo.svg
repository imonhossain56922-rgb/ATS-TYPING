<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 200" width="100%" height="100%">
  <defs>
    <linearGradient id="amrkGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="25%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#EAB308" />
      <stop offset="75%" stop-color="#CA8A04" />
      <stop offset="100%" stop-color="#854D0E" />
    </linearGradient>
    <linearGradient id="amrkGreenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#15803D" />
      <stop offset="50%" stop-color="#22C55E" />
      <stop offset="100%" stop-color="#EAB308" />
    </linearGradient>
    <linearGradient id="amrkBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <filter id="amrkGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#EAB308" flood-opacity="0.35" />
    </filter>
  </defs>
  
  <!-- Subtle dark luxury background frame -->
  <rect width="500" height="200" rx="16" fill="url(#amrkBgGrad)" />
  <rect width="496" height="196" x="2" y="2" rx="14" fill="none" stroke="#334155" stroke-width="1" stroke-opacity="0.6" />

  <!-- Main AMRK Typography -->
  <g filter="url(#amrkGlow)">
    <!-- Letter A -->
    <path d="M 45 125 L 75 35 L 95 35 L 125 125 L 105 125 L 98 102 L 72 102 L 65 125 Z M 77 84 L 93 84 L 85 56 Z" fill="url(#amrkGoldGrad)" />
    <!-- Letter M -->
    <path d="M 135 125 L 135 35 L 157 35 L 175 90 L 193 35 L 215 35 L 215 125 L 197 125 L 197 66 L 181 112 L 169 112 L 153 66 L 153 125 Z" fill="url(#amrkGoldGrad)" />
    <!-- Letter R -->
    <path d="M 228 125 L 228 35 L 265 35 C 285 35 295 45 295 62 C 295 75 287 84 274 87 L 298 125 L 275 125 L 254 90 L 248 90 L 248 125 Z M 248 74 L 263 74 C 272 74 276 70 276 63 C 276 55 271 52 263 52 L 248 52 Z" fill="url(#amrkGoldGrad)" />
    <!-- Letter K -->
    <path d="M 308 125 L 308 35 L 328 35 L 328 72 L 362 35 L 387 35 L 348 77 L 390 125 L 364 125 L 333 89 L 328 94 L 328 125 Z" fill="url(#amrkGoldGrad)" />
  </g>

  <!-- Dynamic swoosh across AMRK -->
  <path d="M 35 110 Q 220 70 460 30 Q 300 82 35 110 Z" fill="url(#amrkGreenGrad)" opacity="0.9" />

  <!-- Divider line -->
  <line x1="45" y1="140" x2="455" y2="140" stroke="#CA8A04" stroke-width="1.5" stroke-opacity="0.7" />

  <!-- TYPING SERVICES Subtitle -->
  <text x="250" y="162" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="15" letter-spacing="7" fill="#FDE047">
    TYPING SERVICES
  </text>
  <!-- Arabic subtext -->
  <text x="250" y="184" text-anchor="middle" font-family="'Cairo', system-ui, sans-serif" font-weight="700" font-size="13" letter-spacing="2" fill="#86EFAC">
    خدمات الطباعة والمعاملات الحكومية
  </text>
</svg>
